<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Site Visit | OCR Design</title>
    <meta
      name="description"
      content="Book an OCR Design job-site visit by phone. Ottawa Construction and Renovation comes to the site of operation — no office drop-in."
    />
    <link rel="canonical" href="https://northlinestudio.ca/contact.html" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1C2228" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <main class="section">
      <div class="wrap split">
        <div>
          <p class="kicker">Contact us</p>
          <h1 class="display" style="font-size:clamp(36px,5vw,56px);margin:8px 0 0">Call to book a visit at the job site.</h1>
          <p class="lede" style="margin-top: 20px">
            OCR Design — Ottawa Construction and Renovation — comes to the site of operation.
            Appointments are taken on the phone. There is no office to visit.
          </p>
          <p class="kicker" style="margin-top: 40px">Call</p>
          <p style="font-size: 28px; font-weight: 700; margin: 4px 0"><a href="tel:+16136183477">(613) 618-3477</a></p>
          <p class="fine">Available 24 hours a day, 7 days a week.</p>
          <p class="kicker" style="margin-top: 28px">Email</p>
          <p><a href="mailto:hello@northlinestudio.ca">hello@northlinestudio.ca</a></p>
        </div>
        <form data-quote-form class="book-form">
          <div class="form-2">
            <label>First name<input class="field" name="first" required /></label>
            <label>Last name<input class="field" name="last" required /></label>
          </div>
          <label>Phone <span class="hint">(required)</span><input class="field" type="tel" name="phone" required /></label>
          <label>Email <span class="hint">(optional)</span><input class="field" type="email" name="email" /></label>
          <label>Job-site address<input class="field" name="address" required /></label>
          <div class="form-2">
            <label>Preferred date<input class="field" type="date" name="date" required /></label>
            <label>
              Preferred time
              <select class="field" name="time" required>
                <option value="" disabled selected>Choose a time</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
              </select>
            </label>
          </div>
          <label>
            What do you want to build or renovate?
            <textarea class="field" name="project" rows="5" required></textarea>
          </label>
          <button class="btn" type="submit">Request a site visit →</button>
        </form>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="assets/app.js"></script>
  </body>
</html>
